# DDEV configuration for local Drupal Health Monitor development.
# Production runs from the repository Dockerfile on Railway; this file is local only.

# Project identity and Drupal document root.
# The project name provides https://health-monitor.ddev.site.
name: health-monitor
type: drupal11
docroot: web

# Match production's PHP runtime while using DDEV's nginx + PHP-FPM web stack.
php_version: "8.4"
webserver_type: nginx-fpm

# Keep Xdebug off by default for performance. Enable it temporarily with
# `ddev xdebug` and disable it again with `ddev xdebug off`.
xdebug_enabled: false

# Match Railway's production database engine and version.
database:
  type: mysql
  version: "8.4"

# Use DDEV's standard wildcard domain when DNS is available, falling back to
# local host-file routing when it is not.
use_dns_when_possible: true

# Demo client sites are independent Drupal multisites with their own databases.
additional_hostnames:
  - client-one
  - client-two
additional_fqdns: []

# Use Composer 2 for dependency management.
composer_version: "2"

# Node.js is available for future theme tooling. Corepack manages package-manager
# shims such as pnpm and Yarn without installing them globally.
nodejs_version: "24"
corepack_enable: true

# Add NAME=value entries here only when local web-container variables are needed.
# Secrets belong in untracked local settings, never in this committed file.
web_environment: []

# Provision the two demo clients idempotently after DDEV is ready.
hooks:
  post-start:
    - exec: "bash /mnt/ddev_config/commands/web/oauth-keys"
    - exec: "bash /mnt/ddev_config/commands/web/demo-sites"
